title: "Language Modelling — The Complete Guide"
short_title: "Language Modelling"
description: "From tokens to the frontier: a first-principles guide to how large language models are built, trained, aligned, compressed and served — updated for late 2026, with tensor shapes on every page, verified code, and 23 interactive labs."
baseurl: "/language-modelling"
url: "https://karam-nus.github.io"
updated: "November 2026"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

exclude:
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - PROMPT.md
  - node_modules/

