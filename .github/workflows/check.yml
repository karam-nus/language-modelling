name: Check site

# Builds the site and runs the lab tests on every push and pull request.
# Publishing is unchanged: GitHub Pages still builds the site from the branch.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lab arithmetic tests
        run: node tools/test_labs.js

      - name: No inline styles in chapters
        run: |
          if grep -n 'style="' [0-9]*.md appendix_*.md README.md labs.md; then
            echo "Use a CSS class instead of inline styles."; exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/language-modelling"
        env:
          JEKYLL_ENV: production

      - name: Search index is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('_site/assets/data/search.json','utf8'))"
